<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FacelessStudio</title>
<meta name="description" content="FacelessStudio: panel de canales y vídeos">
<meta name="theme-color" content="#07090f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FacelessStudio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root { color-scheme: dark; --bg: #07090f; --text: #f5f7ff; --muted: rgba(235,240,255,.66); --accent: #8b9dff; --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; min-height: 100dvh; color: var(--text); background: var(--bg); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg.i { width: 24px; height: 24px; fill: currentColor; display: block; }
h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); }
.bg i { position: absolute; width: 120vmax; height: 120vmax; border-radius: 50%; will-change: transform; animation: drift 26s ease-in-out infinite alternate; }
.bg i:nth-child(1) { left: -50vmax; top: -45vmax; background: radial-gradient(circle, rgba(59,108,255,.5), transparent 62%); }
.bg i:nth-child(2) { right: -60vmax; top: 20vmax; background: radial-gradient(circle, rgba(139,69,255,.4), transparent 62%); animation-duration: 32s; animation-delay: -8s; }
.bg i:nth-child(3) { left: -30vmax; bottom: -70vmax; background: radial-gradient(circle, rgba(255,77,157,.28), transparent 62%); animation-duration: 38s; animation-delay: -14s; }
@keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(8vmax,6vmax,0) scale(1.12); } }
.glass { background: linear-gradient(135deg, rgba(255,255,255,.20), rgba(255,255,255,.06)); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%); border: 1px solid rgba(255,255,255,.20); box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 10px 30px rgba(0,0,0,.35); }
.bar { position: sticky; top: 0; z-index: 10; padding: calc(var(--sat) + 10px) 16px 10px; background: linear-gradient(to bottom, rgba(7,9,15,.82), rgba(7,9,15,.4)); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(255,255,255,.08); }
.brand { display: flex; align-items: center; gap: 12px; max-width: 1100px; margin: 0 auto; }
.brand .logo { width: 40px; height: 40px; flex: none; filter: drop-shadow(0 4px 12px rgba(139,69,255,.5)); }
h1 { margin: 0; font-size: 22px; line-height: 1.1; letter-spacing: -.02em; font-weight: 800; background: linear-gradient(90deg, #fff, #c9b8ff 60%, #ff9ccb); -webkit-background-clip: text; background-clip: text; color: transparent; }
#sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
main { padding: 8px 16px calc(var(--sab) + 104px); max-width: 1100px; margin: 0 auto; }
.tools { display: grid; gap: 10px; padding-top: 6px; }
.search { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: 21px; color: var(--muted); }
.search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 16px; }
.chips { display: flex; gap: 8px; margin: 0 -16px; padding: 2px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 17px; font-size: 14px; font-weight: 600; color: var(--muted); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--accent)); }
.chip[aria-pressed="true"] { color: #fff; background: linear-gradient(135deg, rgba(122,162,255,.55), rgba(177,105,255,.4)); border-color: rgba(255,255,255,.4); }
.opts { display: flex; gap: 8px; }
.opts select { flex: 1; min-width: 0; height: 38px; padding: 0 14px; border-radius: 19px; color: var(--text); font: inherit; font-size: 14px; font-weight: 600; outline: 0; -webkit-appearance: none; appearance: none; }
.opts select option { color: #111; }
.round { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; padding-top: 12px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(4, minmax(0,1fr)); } }
.grid.list { grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 700px) { .grid.list { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.card { position: relative; display: block; width: 100%; aspect-ratio: 9/16; border-radius: 28px; overflow: hidden; border: 1px solid rgba(255,255,255,.22); background: #11141f; text-align: left; box-shadow: 0 14px 34px rgba(0,0,0,.45); }
.card:active, .lrow:active, .mini:active { transform: scale(.97); }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .meta { position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 10px 12px; border-radius: 20px; }
.card .meta strong { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.chn { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--muted); }
.chn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.chn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .fav { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #ff6b8a; }
.card .fav svg { width: 16px; height: 16px; }
.dur { position: absolute; top: 10px; left: 10px; padding: 3px 9px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.2); }
.prog::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: linear-gradient(90deg, #3b6cff, #ff4d9d); }
.lrow { position: relative; display: flex; gap: 12px; width: 100%; padding: 8px; border-radius: 22px; text-align: left; align-items: center; }
.lrow .th { position: relative; width: 64px; aspect-ratio: 9/16; flex: none; border-radius: 14px; overflow: hidden; background: #11141f; }
.lrow .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lrow .info { flex: 1; min-width: 0; }
.lrow strong { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.lrow small { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
.msg { grid-column: 1/-1; text-align: center; padding: 48px 16px; color: var(--muted); }
.msg button { margin-top: 14px; height: 40px; padding: 0 20px; border-radius: 20px; color: var(--text); }
.skel { aspect-ratio: 9/16; border-radius: 28px; background: linear-gradient(110deg, rgba(255,255,255,.05) 30%, rgba(255,255,255,.13) 50%, rgba(255,255,255,.05) 70%); background-size: 200% 100%; animation: shine 1.4s linear infinite; }
@keyframes shine { to { background-position-x: -200%; } }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; padding-top: 8px; }
@media (min-width: 700px) { .stats { grid-template-columns: repeat(4, minmax(0,1fr)); } }
.stat { padding: 14px 16px; border-radius: 24px; }
.stat b { display: block; font-size: 26px; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
.block { margin-top: 22px; }
.rail { display: flex; gap: 10px; margin: 10px -16px 0; padding: 2px 16px 8px; overflow-x: auto; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.mini { position: relative; flex: none; width: 112px; aspect-ratio: 9/16; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,.2); background: #11141f; }
.mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 8px; font-size: 11px; font-weight: 600; line-height: 1.2; text-align: left; background: linear-gradient(to top, rgba(0,0,0,.85), transparent); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
/* Tarjeta de canal: banner, logo circular, nombre y cifras, como en el panel de escritorio */
.chcard { display: block; width: 100%; margin-top: 12px; overflow: hidden; border-radius: 22px; border: 1px solid rgba(255,255,255,.18); background: rgba(20,22,32,.78); text-align: left; box-shadow: 0 14px 34px rgba(0,0,0,.45); transition: transform .15s, border-color .15s; }
.chcard:active { transform: scale(.98); }
@media (hover: hover) { .chcard:hover { transform: translateY(-3px); border-color: var(--c); } }
.chbanner-box { aspect-ratio: 7/2; overflow: hidden; border-bottom: 1px solid rgba(255,255,255,.14); background: linear-gradient(135deg, #1b1d2b, #3a2f1c 55%, var(--c)); }
.chbanner { display: block; width: 100%; height: 100%; object-fit: cover; }
.chinfo { display: flex; align-items: center; gap: 14px; padding: 16px; }
.chlogo-box { position: relative; flex: none; width: 64px; height: 64px; overflow: hidden; display: grid; place-items: center; border-radius: 50%; border: 2px solid rgba(255,255,255,.22); background: var(--c); color: #1a1408; }
.chlogo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.chinitial { font: 700 1.6rem Georgia, serif; text-transform: uppercase; }
.chtext { flex: 1; min-width: 0; }
.chtext h3 { margin: 0; font-size: 19px; line-height: 1.25; overflow-wrap: anywhere; }
.chtext p { margin: 2px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.chstats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chstats span { padding: 2px 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 99px; background: rgba(255,255,255,.06); color: var(--muted); font-size: 12px; white-space: nowrap; }
.chgo { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; color: var(--c); font-size: 18px; }
.tabs { position: fixed; left: 14px; right: 14px; bottom: calc(var(--sab) + 10px); z-index: 20; display: flex; gap: 4px; max-width: 520px; margin: 0 auto; padding: 6px; border-radius: 34px; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 4px; border-radius: 28px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tab[aria-current="page"] { color: #fff; background: linear-gradient(135deg, rgba(122,162,255,.5), rgba(177,105,255,.4)); }
.player { position: fixed; inset: 0; z-index: 50; background: #000; touch-action: none; overscroll-behavior: contain; }
.stage { position: absolute; inset: 0; }
.stage video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
.flash { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; display: grid; place-items: center; opacity: 0; pointer-events: none; }
.flash svg { width: 44px; height: 44px; }
.flash.show { animation: pop .6s ease-out; }
@keyframes pop { 0% { opacity: 0; transform: scale(.7); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
.icon { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; }
.icon:active { transform: scale(.9); }
.icon:disabled { opacity: .35; }
.icon.big { width: 60px; height: 60px; }
.icon.big svg { width: 30px; height: 30px; }
.icon.on { color: #ff6b8a; }
.top { position: absolute; top: calc(var(--sat) + 10px); left: 14px; right: 14px; display: flex; align-items: center; gap: 8px; }
.top .sp { flex: 1; }
.pill { min-width: 42px; height: 38px; padding: 0 12px; border-radius: 19px; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.pill svg { width: 20px; height: 20px; }
.dock { position: absolute; left: 12px; right: 12px; bottom: calc(var(--sab) + 12px); padding: 14px 16px 12px; border-radius: 32px; touch-action: manipulation; }
.dock h2 { margin: 0 0 6px; font-size: 16px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.scrub { display: flex; align-items: center; gap: 10px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.player.sheet-open .dock { visibility: hidden; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 28px; margin: 0; background: transparent; outline: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, #fff var(--p, 0%), rgba(255,255,255,.28) var(--p, 0%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.28); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: #fff; }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: #fff; }
.sheet { position: absolute; left: 12px; right: 12px; bottom: calc(var(--sab) + 12px); max-height: 72dvh; overflow-y: auto; overscroll-behavior: contain; padding: 20px 20px 16px; border-radius: 32px; touch-action: pan-y; }
.sheet h3 { margin: 0 0 10px; font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
.sheet p { margin: 0 0 12px; color: rgba(245,247,255,.9); overflow-wrap: anywhere; }
.sheet p.when { margin-top: -4px; font-size: 13px; color: var(--muted); }
.sheet h4 { margin: 16px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { padding: 3px 10px; border-radius: 12px; font-size: 13px; background: rgba(255,255,255,.1); }
.sheet ul { margin: 0; padding: 0; list-style: none; font-size: 13px; }
.sheet li { padding: 6px 0; border-top: 1px solid rgba(255,255,255,.08); overflow-wrap: anywhere; }
.sheet a { color: var(--accent); text-decoration: none; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.act { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 19px; font-size: 14px; font-weight: 600; text-decoration: none; color: var(--text); }
.act svg { width: 18px; height: 18px; }
.sheet .shut { display: block; width: 100%; height: 44px; margin-top: 16px; border-radius: 22px; font-weight: 600; }
.toast { position: absolute; left: 50%; top: calc(var(--sat) + 70px); transform: translateX(-50%); max-width: calc(100% - 40px); padding: 10px 16px; border-radius: 18px; font-size: 14px; text-align: center; z-index: 5; }
.toast.app { position: fixed; top: auto; bottom: calc(var(--sab) + 90px); z-index: 60; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .bg i, .skel, .flash.show { animation: none; } }
</style>
</head>

    <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
  </defs>
</svg>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="bar">
  <div class="brand">
    <svg class="logo" role="img" aria-label="FacelessStudio"><use href="#logo"/></svg>
    <div><h1>FacelessStudio</h1><p id="sub"></p></div>
  </div>
</header>

<main>
  <section id="panel" aria-label="Panel"></section>
  <section id="lib" aria-label="Biblioteca" hidden>
    <div class="tools">
      <label class="search glass">
        <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Buscar vídeos" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buscar vídeos">
      </label>
      <div class="chips" id="chChips" aria-label="Canales"></div>
      <div class="chips" id="tagChips" aria-label="Etiquetas"></div>
      <div class="opts">
        <select id="sort" class="glass" aria-label="Ordenar">
          <option value="recent">Más recientes</option>
          <option value="old">Más antiguos</option>
          <option value="unseen">Sin ver primero</option>
          <option value="title">Título A-Z</option>
          <option value="long">Más largos</option>
        </select>
        <button class="round glass" id="viewBtn" type="button" aria-label="Cambiar vista"><svg class="i"><use href="#i-list"/></svg></button>
      </div>
    </div>
    <div class="grid" id="grid" aria-live="polite"></div>
  </section>
</main>
<noscript><p class="msg">Esta aplicación necesita JavaScript.</p></noscript>

<nav class="tabs glass" aria-label="Secciones">
  <button class="tab" type="button" data-tab="panel"><svg class="i"><use href="#i-panel"/></svg>Panel</button>
  <button class="tab" type="button" data-tab="lib"><svg class="i"><use href="#i-lib"/></svg>Biblioteca</button>
  <button class="tab" type="button" data-tab="favs"><svg class="i"><use href="#i-heart"/></svg>Favoritos</button>
</nav>
<div class="toast glass app" id="appToast" hidden role="status"></div>

<section id="player" class="player" hidden role="dialog" aria-modal="true" aria-label="Reproductor">
  <div class="stage" id="stage">
    <video id="v" playsinline webkit-playsinline preload="metadata"></video>
    <div class="flash glass" id="flash"><svg class="i"><use href="#i-play"/></svg></div>
  </div>
  <div class="top">
    <button class="icon glass" id="close" type="button" aria-label="Cerrar"><svg class="i"><use href="#i-close"/></svg></button>
    <span class="sp"></span>
    <button class="pill glass" id="rate" type="button" aria-label="Velocidad">1×</button>
    <button class="pill glass" id="mute" type="button" aria-label="Silenciar"><svg class="i"><use href="#i-vol"/></svg></button>
    <div class="pill glass" id="pos" aria-live="polite"></div>
  </div>
  <div class="toast glass" id="toast" hidden role="status"></div>
  <div class="dock glass" id="dock">
    <div class="chn" id="who"></div>
    <h2 id="pt"></h2>
    <div class="scrub">
      <span id="tc">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Progreso">
      <span id="td">0:00</span>
    </div>
    <div class="row">
      <button class="icon glass" id="prev" type="button" aria-label="Vídeo anterior"><svg class="i"><use href="#i-up"/></svg></button>
      <button class="icon glass" id="fav" type="button" aria-label="Favorito"><svg class="i"><use href="#i-heart"/></svg></button>
      <button class="icon glass big" id="play" type="button" aria-label="Reproducir o pausar"><svg class="i"><use href="#i-pause"/></svg></button>
      <button class="icon glass" id="infoBtn" type="button" aria-label="Detalles"><svg class="i"><use href="#i-info"/></svg></button>
      <button class="icon glass" id="next" type="button" aria-label="Vídeo siguiente"><svg class="i"><use href="#i-down"/></svg></button>
    </div>
  </div>
  <div class="sheet glass" id="sheet" hidden></div>
</section>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('fs.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('fs.' + k, JSON.stringify(v)); } catch (e) { /* almacenamiento no disponible */ } },
  };
  const DEF_COLOR = '#7aa2ff';
  const RATES = [1, 1.25, 1.5, 2, 0.75];
  const SORTS = ['recent', 'old', 'unseen', 'title', 'long'];
  const savedSort = store.get('sort', '');
  const savedRate = store.get('rate', 1);
  const state = {
    channels: [], items: [], queue: [], idx: -1,
    tab: 'panel', channel: String(store.get('channel', '')), tag: null, q: '',
    sort: SORTS.includes(savedSort) ? savedSort : 'recent', list: !!store.get('list', false),
    favs: new Set(store.get('favs', [])), seen: store.get('seen', {}) || {},
    muted: !!store.get('muted', false), rate: RATES.includes(savedRate) ? savedRate : 1,
  };
  const el = {
    sub: $('#sub'), panel: $('#panel'), lib: $('#lib'), grid: $('#grid'), q: $('#q'), sort: $('#sort'), viewBtn: $('#viewBtn'),
    chChips: $('#chChips'), tagChips: $('#tagChips'), appToast: $('#appToast'),
    player: $('#player'), stage: $('#stage'), v: $('#v'), flash: $('#flash'), toast: $('#toast'),
    pt: $('#pt'), who: $('#who'), pos: $('#pos'), tc: $('#tc'), td: $('#td'), seek: $('#seek'), rate: $('#rate'),
    prev: $('#prev'), next: $('#next'), play: $('#play'), mute: $('#mute'), fav: $('#fav'), infoBtn: $('#infoBtn'),
    close: $('#close'), sheet: $('#sheet'),
  };
  const v = el.v;

  const okColor = (c) => (/^#[0-9a-f]{3,8}$/i.test(String(c || '')) ? String(c) : DEF_COLOR);
  const fmt = (sec) => { const s = Math.max(0, Math.floor(sec || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const fmtLong = (sec) => { const m = Math.round((sec || 0) / 60); return m >= 60 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min' : m + ' min'; };
  const fmtSize = (b) => (b >= 1073741824 ? (b / 1073741824).toFixed(2) + ' GB' : (b / 1048576).toFixed(0) + ' MB');
  const fmtDate = (s) => {
    if (!s) return '';
    try { return new Intl.DateTimeFormat('es', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(s * 1000)); } catch (e) { return ''; }
  };
  const norm = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
  const mk = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const svgIcon = (id) => {
    const ns = 'http://www.w3.org/2000/svg';
    const s = document.createElementNS(ns, 'svg');
    s.setAttribute('class', 'i');
    const u = document.createElementNS(ns, 'use');
    u.setAttribute('href', '#i-' + id);
    s.appendChild(u);
    return s;
  };
  const setIcon = (btn, id) => btn.querySelector('use').setAttribute('href', '#i-' + id);
  const poster = (src) => { const i = document.createElement('img'); i.src = src; i.alt = ''; i.loading = 'lazy'; i.decoding = 'async'; return i; };
  const chan = (id) => state.channels.find((c) => c.id === id) || state.channels[0] || { id: '', name: '', handle: '', description: '', color: DEF_COLOR, logo: '', banner: '' };
  const sumDur = (list) => list.reduce((a, it) => a + it.duration, 0);

  let appToastTimer = 0;
  function appToast(msg) {
    el.appToast.textContent = msg;
    el.appToast.hidden = false;
    clearTimeout(appToastTimer);
    appToastTimer = setTimeout(() => { el.appToast.hidden = true; }, 2600);
  }
  let toastTimer = 0;
  function toast(msg) {
    const t = el.player.hidden ? el.appToast : el.toast;
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }
  async function copyText(text, okMsg) {
    let ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; }
    } catch (e) { ok = false; }
    if (!ok) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
    }
    toast(ok ? okMsg : 'No se pudo copiar');
  }

  /* ---------- Vistos y progreso ---------- */
  const progress = (it) => {
    const s = state.seen[it.slug];
    if (!s) return 0;
    if (s.t > 3 && s.d > 0) return Math.min(100, (s.t / s.d) * 100);
    return s.w ? 100 : 0;
  };
  const isWatched = (it) => !!(state.seen[it.slug] && state.seen[it.slug].w);
  const isResumable = (it) => { const s = state.seen[it.slug]; return !!s && s.t > 3 && s.d > 0 && s.t < s.d * 0.95; };

  /* ---------- Datos ---------- */
  async function load() {
    el.grid.replaceChildren();
    for (let i = 0; i < 4; i++) el.grid.appendChild(mk('div', 'skel'));
    try {
      const r = await fetch('data.json', { cache: 'no-cache' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      const raw = Array.isArray(data.channels) ? data.channels : [];
      state.channels = raw.filter((c) => c && c.id).map((c) => ({
        id: String(c.id), name: String(c.name || c.id), handle: String(c.handle || ''),
        description: String(c.description || ''), color: okColor(c.color),
        logo: c.logo ? String(c.logo) : '', banner: c.banner ? String(c.banner) : '',
      }));
      if (!state.channels.length) {
        state.channels = [{ id: 'default', name: String(data.channel || 'Mis vídeos'), handle: '', description: '', color: DEF_COLOR, logo: '', banner: '' }];
      }
      const known = new Set(state.channels.map((c) => c.id));
      const first = state.channels[0].id;
      const list = Array.isArray(data.videos) ? data.videos : [];
      state.items = list.filter((x) => x && x.slug && x.video).map((x) => {
        const it = {
          slug: String(x.slug), title: String(x.title || x.slug), video: String(x.video),
          channel: known.has(String(x.channel)) ? String(x.channel) : first,
          poster: x.poster ? String(x.poster) : '', duration: Number(x.duration) || 0,
          size: Number(x.size) || 0, added: Number(x.added) || 0,
          description: Array.isArray(x.description) ? x.description.map(String) : [],
          tags: Array.isArray(x.tags) ? x.tags.map(String) : [],
          credits: Array.isArray(x.credits) ? x.credits : [],
        };
        it.text = norm([it.title, it.description.join(' '), it.tags.join(' ')].join(' '));
        return it;
      });
      if (state.channel && !known.has(state.channel)) state.channel = '';
      render();
    } catch (err) {
      el.panel.replaceChildren();
      el.grid.replaceChildren();
      const box = mk('div', 'msg');
      box.appendChild(mk('p', '', 'No se pudieron cargar los vídeos.'));
      const retry = mk('button', 'glass', 'Reintentar');
      retry.type = 'button';
      retry.addEventListener('click', load);
      box.appendChild(retry);
      (state.tab === 'panel' ? el.panel : el.grid).appendChild(box);
    }
  }

  /* ---------- Pantallas ---------- */
  function render() {
    const n = state.items.length;
    el.sub.textContent = n ? plural(n, 'vídeo', 'vídeos') + ' · ' + plural(state.channels.length, 'canal', 'canales') : 'Panel de canales';
    document.querySelectorAll('.tab').forEach((b) => {
      if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    el.panel.hidden = state.tab !== 'panel';
    el.lib.hidden = state.tab === 'panel';
    if (state.tab === 'panel') renderPanel(); else renderLib();
  }
  function setTab(t) {
    state.tab = t;
    if (t !== 'panel') state.tag = null;
    render();
    window.scrollTo(0, 0);
  }
  function chip(label, on, fn, color) {
    const b = mk('button', 'chip glass');
    b.type = 'button';
    if (color) { b.style.setProperty('--c', color); b.appendChild(mk('i', 'dot')); }
    b.appendChild(document.createTextNode(label));
    b.setAttribute('aria-pressed', String(on));
    b.addEventListener('click', fn);
    return b;
  }
  function chanTag(ch) {
    const t = mk('div', 'chn');
    t.style.setProperty('--c', ch.color);
    t.appendChild(mk('i', 'dot'));
    t.appendChild(mk('span', '', ch.name));
    return t;
  }
  function progBar(parent, it) {
    const p = progress(it);
    if (p > 0 && p < 100) { const bar = mk('div', 'prog'); bar.style.setProperty('--p', p + '%'); parent.appendChild(bar); }
  }

  function libItems() {
    const q = norm(state.q.trim());
    const list = state.items.filter((it) =>
      (!state.channel || it.channel === state.channel) &&
      (state.tab !== 'favs' || state.favs.has(it.slug)) &&
      (!state.tag || it.tags.includes(state.tag)) &&
      (!q || it.text.includes(q)));
    const by = {
      recent: (a, b) => b.added - a.added,
      old: (a, b) => a.added - b.added,
      unseen: (a, b) => (Number(isWatched(a)) - Number(isWatched(b))) || (b.added - a.added),
      title: (a, b) => a.title.localeCompare(b.title, 'es'),
      long: (a, b) => b.duration - a.duration,
    };
    return list.sort(by[state.sort]);
  }

  function renderLib() {
    el.sort.value = state.sort;
    setIcon(el.viewBtn, state.list ? 'lib' : 'list');
    el.viewBtn.setAttribute('aria-label', state.list ? 'Ver en cuadrícula' : 'Ver en lista');
    el.chChips.replaceChildren();
    el.chChips.hidden = state.channels.length < 2;
    el.chChips.appendChild(chip('Todos los canales', !state.channel, () => { state.channel = ''; state.tag = null; store.set('channel', ''); renderLib(); }));
    state.channels.forEach((c) => {
      el.chChips.appendChild(chip(c.name, state.channel === c.id, () => {
        state.channel = state.channel === c.id ? '' : c.id; state.tag = null; store.set('channel', state.channel); renderLib();
      }, c.color));
    });
    const scope = state.items.filter((it) => (!state.channel || it.channel === state.channel) && (state.tab !== 'favs' || state.favs.has(it.slug)));
    const counts = new Map();
    scope.forEach((it) => it.tags.forEach((t) => counts.set(t, (counts.get(t) || 0) + 1)));
    const tags = [...counts.entries()].filter(([t, n]) => n >= 2 && t.toLowerCase() !== '#shorts')
      .sort((a, b) => b[1] - a[1]).slice(0, 12).map(([t]) => t);
    if (state.tag && !tags.includes(state.tag)) state.tag = null;
    el.tagChips.replaceChildren();
    el.tagChips.hidden = !tags.length;
    tags.forEach((t) => el.tagChips.appendChild(chip(t, state.tag === t, () => { state.tag = state.tag === t ? null : t; renderLib(); })));

    const list = libItems();
    el.grid.className = 'grid' + (state.list ? ' list' : '');
    el.grid.replaceChildren();
    if (!list.length) {
      let text = 'Ningún vídeo coincide.';
      if (!state.items.length) text = 'Aún no hay vídeos publicados.';
      else if (state.tab === 'favs' && !state.favs.size) text = 'Aún no tienes favoritos. Toca el corazón en el reproductor.';
      el.grid.appendChild(mk('p', 'msg', text));
      return;
    }
    list.forEach((it, i) => el.grid.appendChild(state.list ? listRow(it, list, i) : gridCard(it, list, i)));
  }

  function gridCard(it, queue, i) {
    const b = mk('button', 'card');
    b.type = 'button';
    b.setAttribute('aria-label', it.title);
    if (it.poster) b.appendChild(poster(it.poster));
    if (it.duration) b.appendChild(mk('span', 'dur glass', fmt(it.duration)));
    if (state.favs.has(it.slug)) { const f = mk('span', 'fav glass'); f.appendChild(svgIcon('heartfill')); b.appendChild(f); }
    const meta = mk('div', 'meta glass');
    meta.appendChild(mk('strong', '', it.title));
    meta.appendChild(chanTag(chan(it.channel)));
    b.appendChild(meta);
    progBar(b, it);
    b.addEventListener('click', () => openQueue(queue, i));
    return b;
  }
  function listRow(it, queue, i) {
    const b = mk('button', 'lrow glass');
    b.type = 'button';
    b.setAttribute('aria-label', it.title);
    const th = mk('div', 'th');
    if (it.poster) th.appendChild(poster(it.poster));
    progBar(th, it);
    const info = mk('div', 'info');
    info.appendChild(mk('strong', '', it.title));
    info.appendChild(chanTag(chan(it.channel)));
    const bits = [it.duration ? fmt(it.duration) : '', fmtDate(it.added), isWatched(it) && !isResumable(it) ? 'Visto' : ''].filter(Boolean);
    info.appendChild(mk('small', '', bits.join(' · ')));
    b.append(th, info);
    b.addEventListener('click', () => openQueue(queue, i));
    return b;
  }
  function mini(it, queue, i) {
    const b = mk('button', 'mini');
    b.type = 'button';
    b.setAttribute('aria-label', it.title);
    if (it.poster) b.appendChild(poster(it.poster));
    b.appendChild(mk('span', 'cap', it.title));
    progBar(b, it);
    b.addEventListener('click', () => openQueue(queue, i));
    return b;
  }
  function rail(title, list) {
    const s = mk('div', 'block');
    s.appendChild(mk('h2', '', title));
    const r = mk('div', 'rail');
    list.forEach((it, i) => r.appendChild(mini(it, list, i)));
    s.appendChild(r);
    return s;
  }

  function channelCard(c) {
    const list = state.items.filter((it) => it.channel === c.id);
    const card = mk('button', 'chcard');
    card.type = 'button';
    card.style.setProperty('--c', c.color);
    const stats = [plural(list.length, 'vídeo', 'vídeos'), fmtLong(sumDur(list))];
    card.setAttribute('aria-label', 'Abrir el canal ' + c.name + ': ' + stats.join(', '));

    const bbox = mk('div', 'chbanner-box');
    if (c.banner) {
      const b = document.createElement('img');
      b.className = 'chbanner'; b.alt = ''; b.decoding = 'async'; b.src = c.banner;
      b.addEventListener('error', () => { b.hidden = true; });
      bbox.appendChild(b);
    }
    const lbox = mk('div', 'chlogo-box');
    const initial = mk('span', 'chinitial', (c.name.trim()[0] || '?'));
    initial.setAttribute('aria-hidden', 'true');
    lbox.appendChild(initial);
    if (c.logo) {
      const l = document.createElement('img');
      l.className = 'chlogo'; l.alt = ''; l.decoding = 'async'; l.src = c.logo;
      l.addEventListener('error', () => { l.hidden = true; initial.hidden = false; });
      l.addEventListener('load', () => { initial.hidden = true; });
      lbox.appendChild(l);
    }
    const text = mk('div', 'chtext');
    text.appendChild(mk('h3', '', c.name));
    if (c.description) text.appendChild(mk('p', '', c.description));
    const chips = mk('div', 'chstats');
    stats.forEach((s) => chips.appendChild(mk('span', '', s)));
    if (list.length) chips.appendChild(mk('span', '', 'Último: ' + fmtDate(Math.max(...list.map((it) => it.added)))));
    text.appendChild(chips);
    const go = mk('span', 'chgo', '→');
    go.setAttribute('aria-hidden', 'true');
    card.append(bbox, mk('div', 'chinfo'));
    card.lastChild.append(lbox, text, go);
    card.addEventListener('click', () => { state.channel = c.id; store.set('channel', c.id); setTab('lib'); });
    return card;
  }

  function renderPanel() {
    const p = el.panel;
    p.replaceChildren();
    if (!state.items.length) { p.appendChild(mk('p', 'msg', 'Aún no hay vídeos publicados.')); return; }
    const watched = state.items.filter(isWatched).length;
    const stats = mk('div', 'stats');
    [[String(state.items.length), 'Vídeos'], [String(state.channels.length), 'Canales'],
      [fmtLong(sumDur(state.items)), 'Duración total'], [watched + ' / ' + state.items.length, 'Vistos']].forEach(([n, l]) => {
      const s = mk('div', 'stat glass');
      s.append(mk('b', '', n), mk('span', '', l));
      stats.appendChild(s);
    });
    p.appendChild(stats);

    const head = mk('div', 'block');
    head.appendChild(mk('h2', '', state.channels.length === 1 ? 'Canal' : 'Canales'));
    state.channels.forEach((c) => head.appendChild(channelCard(c)));
    p.appendChild(head);

    const cont = state.items.filter(isResumable);
    if (cont.length) p.appendChild(rail('Continuar viendo', cont));
    p.appendChild(rail('Recientes', [...state.items].sort((a, b) => b.added - a.added).slice(0, 12)));
  }

  /* ---------- Reproductor ---------- */
  let scrubbing = false;
  let lastSave = 0;
  const cur = () => state.queue[state.idx];

  function syncPlay() { setIcon(el.play, v.paused ? 'play' : 'pause'); }
  function syncMute() {
    v.muted = state.muted;
    setIcon(el.mute, state.muted ? 'mute' : 'vol');
    el.mute.setAttribute('aria-label', state.muted ? 'Activar sonido' : 'Silenciar');
  }
  function syncRate() {
    v.defaultPlaybackRate = state.rate;
    v.playbackRate = state.rate;
    el.rate.textContent = state.rate + '×';
  }
  function syncFav() {
    const it = cur();
    const on = !!it && state.favs.has(it.slug);
    setIcon(el.fav, on ? 'heartfill' : 'heart');
    el.fav.classList.toggle('on', on);
    el.fav.setAttribute('aria-pressed', String(on));
  }
  function syncTime() {
    const d = v.duration;
    if (!isFinite(d) || d <= 0) {
      el.tc.textContent = '0:00';
      el.td.textContent = fmt(cur() ? cur().duration : 0);
      return;
    }
    const pct = (v.currentTime / d) * 100;
    if (!scrubbing) el.seek.value = String(Math.round(pct * 10));
    el.seek.style.setProperty('--p', pct + '%');
    el.tc.textContent = fmt(v.currentTime);
    el.td.textContent = fmt(d);
  }
  function saveSeen(force) {
    const now = Date.now();
    if (force || now - lastSave > 3000) { lastSave = now; store.set('seen', state.seen); }
  }
  function track() {
    const it = cur();
    if (!it || !isFinite(v.duration) || v.duration <= 0 || v.ended) return;
    const prev = state.seen[it.slug] || {};
    state.seen[it.slug] = { t: v.currentTime, d: v.duration, w: !!prev.w || v.currentTime / v.duration > 0.9 };
    saveSeen(false);
  }

  function openQueue(queue, i) {
    state.queue = queue;
    if (el.player.hidden) {
      el.player.hidden = false;
      document.body.classList.add('lock');
      history.pushState({ fs: 1 }, '');
    }
    showItem(i);
  }
  function showItem(i) {
    const it = state.queue[i];
    if (!it) return;
    if (cur() && !v.paused) track();
    state.idx = i;
    el.sheet.hidden = true;
    el.player.classList.remove('sheet-open');
    if (it.poster) v.poster = it.poster; else v.removeAttribute('poster');
    v.src = it.video;
    syncMute();
    syncRate();
    el.pt.textContent = it.title;
    const ch = chan(it.channel);
    el.who.style.setProperty('--c', ch.color);
    el.who.replaceChildren(mk('i', 'dot'), mk('span', '', ch.name));
    el.pos.textContent = (i + 1) + ' / ' + state.queue.length;
    el.prev.disabled = i === 0;
    el.next.disabled = i === state.queue.length - 1;
    el.seek.value = '0';
    el.seek.style.setProperty('--p', '0%');
    syncFav();
    syncTime();
    const pr = v.play();
    if (pr && pr.catch) pr.catch(() => { syncPlay(); toast('Toca para reproducir'); });
  }
  function hidePlayer() {
    if (el.player.hidden) return;
    track();
    saveSeen(true);
    v.pause();
    v.removeAttribute('src');
    v.load();
    state.idx = -1;
    el.player.hidden = true;
    el.sheet.hidden = true;
    el.player.classList.remove('sheet-open');
    document.body.classList.remove('lock');
    render();
  }
  function closePlayer() {
    if (history.state && history.state.fs) history.back(); else hidePlayer();
  }
  function step(d) {
    const n = state.idx + d;
    if (n >= 0 && n < state.queue.length) showItem(n);
  }
  function togglePlay() {
    if (!cur()) return;
    if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } else v.pause();
    el.flash.classList.remove('show');
    void el.flash.offsetWidth;
    setIcon(el.flash, v.paused ? 'pause' : 'play');
    el.flash.classList.add('show');
  }
  function toggleFav() {
    const it = cur();
    if (!it) return;
    if (state.favs.has(it.slug)) state.favs.delete(it.slug); else state.favs.add(it.slug);
    store.set('favs', [...state.favs]);
    syncFav();
    toast(state.favs.has(it.slug) ? 'Añadido a favoritos' : 'Quitado de favoritos');
  }

  function buildSheet(it) {
    const ch = chan(it.channel);
    el.sheet.replaceChildren();
    el.sheet.appendChild(mk('h3', '', it.title));
    el.sheet.appendChild(mk('p', 'when', [ch.name, fmtDate(it.added), it.size ? fmtSize(it.size) : ''].filter(Boolean).join(' · ')));
    const acts = mk('div', 'acts');
    const act = (icon, label, fn) => {
      const b = mk('button', 'act glass');
      b.type = 'button';
      b.appendChild(svgIcon(icon));
      b.appendChild(document.createTextNode(label));
      b.addEventListener('click', fn);
      acts.appendChild(b);
    };
    act('copy', 'Título', () => copyText(it.title, 'Título copiado'));
    act('copy', 'Descripción', () => copyText(it.description.join('\n\n'), 'Descripción copiada'));
    if (it.tags.length) act('copy', 'Etiquetas', () => copyText(it.tags.join(' '), 'Etiquetas copiadas'));
    if (navigator.share) {
      act('share', 'Compartir', () => {
        const url = new URL(it.video, location.href).href;
        navigator.share({ title: it.title, text: it.title, url }).catch(() => {});
      });
    }
    const dl = mk('a', 'act glass');
    dl.href = it.video;
    dl.download = it.slug + '.mp4';
    dl.appendChild(svgIcon('save'));
    dl.appendChild(document.createTextNode('Descargar'));
    acts.appendChild(dl);
    el.sheet.appendChild(acts);
    it.description.forEach((t) => el.sheet.appendChild(mk('p', '', t)));
    if (it.tags.length) {
      el.sheet.appendChild(mk('h4', '', 'Etiquetas'));
      const tags = mk('div', 'tags');
      it.tags.forEach((t) => tags.appendChild(mk('span', '', t)));
      el.sheet.appendChild(tags);
    }
    const links = it.credits.filter((c) => c && /^https?:\/\//.test(String(c.url)));
    if (links.length) {
      el.sheet.appendChild(mk('h4', '', 'Créditos de imágenes'));
      const ul = mk('ul');
      links.forEach((c) => {
        const li = mk('li');
        const a = mk('a', '', String(c.text || c.url));
        a.href = String(c.url); a.target = '_blank'; a.rel = 'noopener noreferrer';
        li.appendChild(a);
        ul.appendChild(li);
      });
      el.sheet.appendChild(ul);
    }
    const shut = mk('button', 'shut glass', 'Cerrar');
    shut.type = 'button';
    shut.addEventListener('click', toggleSheet);
    el.sheet.appendChild(shut);
  }
  function toggleSheet() {
    const it = cur();
    if (!it) return;
    if (el.sheet.hidden) { buildSheet(it); el.sheet.hidden = false; el.sheet.scrollTop = 0; } else el.sheet.hidden = true;
    el.player.classList.toggle('sheet-open', !el.sheet.hidden);
  }

  v.addEventListener('timeupdate', () => { syncTime(); track(); });
  v.addEventListener('durationchange', syncTime);
  v.addEventListener('loadedmetadata', () => {
    syncRate();
    const it = cur();
    const s = it && state.seen[it.slug];
    if (s && s.t > 3 && s.t < v.duration - 3) v.currentTime = s.t;
    syncTime();
  });
  v.addEventListener('play', syncPlay);
  v.addEventListener('pause', () => { syncPlay(); track(); saveSeen(true); });
  v.addEventListener('ended', () => {
    const it = cur();
    if (it) { state.seen[it.slug] = { t: 0, d: v.duration || it.duration, w: true }; saveSeen(true); }
    syncPlay();
    if (state.idx < state.queue.length - 1) step(1);
  });
  v.addEventListener('error', () => { if (v.getAttribute('src')) toast('No se pudo reproducir este vídeo'); });

  el.seek.addEventListener('input', () => {
    scrubbing = true;
    if (isFinite(v.duration)) {
      el.tc.textContent = fmt((v.duration * el.seek.value) / 1000);
      el.seek.style.setProperty('--p', el.seek.value / 10 + '%');
    }
  });
  el.seek.addEventListener('change', () => {
    if (isFinite(v.duration)) v.currentTime = (v.duration * el.seek.value) / 1000;
    scrubbing = false;
  });
  el.stage.addEventListener('click', togglePlay);
  let sx = 0;
  let sy = 0;
  el.stage.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  el.stage.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - sx;
    const dy = t.clientY - sy;
    if (Math.abs(dy) > 70 && Math.abs(dy) > Math.abs(dx) * 1.5) step(dy < 0 ? 1 : -1);
  }, { passive: true });
  el.play.addEventListener('click', togglePlay);
  el.prev.addEventListener('click', () => step(-1));
  el.next.addEventListener('click', () => step(1));
  el.fav.addEventListener('click', toggleFav);
  el.infoBtn.addEventListener('click', toggleSheet);
  el.close.addEventListener('click', closePlayer);
  el.mute.addEventListener('click', () => { state.muted = !state.muted; store.set('muted', state.muted); syncMute(); });
  el.rate.addEventListener('click', () => {
    state.rate = RATES[(RATES.indexOf(state.rate) + 1) % RATES.length];
    store.set('rate', state.rate);
    syncRate();
  });
  window.addEventListener('popstate', hidePlayer);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { track(); saveSeen(true); } });
  document.addEventListener('keydown', (e) => {
    if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) && e.target !== el.seek) return;
    if (el.player.hidden) return;
    if (e.key === 'Escape') closePlayer();
    else if (e.key === 'ArrowDown') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
    else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'm') el.mute.click();
    else if (e.key === 'f') toggleFav();
  });

  let qTimer = 0;
  el.q.addEventListener('input', () => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { state.q = el.q.value; renderLib(); }, 120);
  });
  el.sort.addEventListener('change', () => {
    state.sort = SORTS.includes(el.sort.value) ? el.sort.value : 'recent';
    store.set('sort', state.sort);
    renderLib();
  });
  el.viewBtn.addEventListener('click', () => { state.list = !state.list; store.set('list', state.list); renderLib(); });
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));

  syncMute();
  syncRate();
  load();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
